name: Refresh gaming news

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checkpoint-news

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Refresh RSS snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=8 origin news-data; then
            mkdir -p "$RUNNER_TEMP/news"
            git show FETCH_HEAD:news.json > "$RUNNER_TEMP/news/news.json"
            git worktree add --detach "$RUNNER_TEMP/news-tree" FETCH_HEAD
          else
            mkdir -p "$RUNNER_TEMP/news"
            cp assets/news.json "$RUNNER_TEMP/news/news.json"
            git worktree add --detach "$RUNNER_TEMP/news-tree"
          fi
          python scripts/refresh_news.py "$RUNNER_TEMP/news/news.json"
          if python scripts/refresh_gamepass.py "$RUNNER_TEMP/news/gamepass.json"; then
            cp "$RUNNER_TEMP/news/gamepass.json" "$RUNNER_TEMP/news-tree/gamepass.json"
            git -C "$RUNNER_TEMP/news-tree" add gamepass.json
          fi
          cd "$RUNNER_TEMP/news-tree"
          steam_updated=$(git log -1 --format=%ct -- steam-reviews.csv)
          if [ "$(( $(date +%s) - ${steam_updated:-0} ))" -ge 86400 ]; then
            # The Game Census publishes aggregate Steam review counts under CC BY 4.0.
            steam_snapshot="$RUNNER_TEMP/news/steam-reviews.csv"
            if curl -fsSL --max-time 30 --retry 2 https://thegamecensus.com/data/games-index.csv -o "$steam_snapshot" &&
              [ "$(wc -l < "$steam_snapshot")" -gt 1000 ] &&
              head -n 1 "$steam_snapshot" | grep -q '^app_id,name,slug,release_date,is_free,total_positive,total_negative,'; then
              cp "$steam_snapshot" steam-reviews.csv
              git add steam-reviews.csv
            fi
          fi
          cp "$RUNNER_TEMP/news/news.json" news.json
          git add news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh gaming headlines'
          git push origin HEAD:refs/heads/news-data
