<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e0d18">
  <link rel="icon" type="image/png" href="assets/checkpoint-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/checkpoint-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Checkpoint — dziennik gracza</title>
  <link rel="stylesheet" href="style.css?v=afterglow9">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="#now" aria-label="Checkpoint, gram teraz" data-i18n-label="Checkpoint, gram teraz">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>CHECK<span class="brand-accent">POINT</span><small data-i18n="Dziennik gracza">Dziennik gracza</small></span>
    </a>
    <a class="button account-link" href="#settings"><span aria-hidden="true">⚙</span> <span data-i18n="Ustawienia">Ustawienia</span></a>
  </header>
  <aside class="weather-strip" id="weather" aria-label="Pogoda" data-i18n-label="Pogoda" aria-live="polite"></aside>
  <main id="app"></main>
  <nav aria-label="Nawigacja" data-i18n-label="Nawigacja">
    <a href="#now"><span aria-hidden="true">◈</span><span class="nav-label" data-i18n="Gram teraz">Gram teraz</span></a>
    <a href="#library"><span aria-hidden="true">▦</span><span class="nav-label" data-i18n="Biblioteka">Biblioteka</span></a>
    <a href="#news"><span aria-hidden="true">▤</span><span class="nav-label" data-i18n="Newsy">Newsy</span></a>
    <a href="#rank"><span aria-hidden="true">☆</span><span class="nav-label" data-i18n="Ranking">Ranking</span></a>
    <a href="#connections"><span aria-hidden="true">⛓</span><span class="nav-label" data-i18n="Połączenia">Połączenia</span></a>
  </nav>
  <dialog id="modal" aria-labelledby="dialog-title">
    <form id="form">
      <button type="button" id="close" aria-label="Zamknij" data-i18n-label="Zamknij">×</button>
      <div id="fields"></div>
      <button class="primary" id="save" data-i18n="Zapisz">Zapisz</button>
    </form>
  </dialog>
  <script src="locale.js?v=afterglow9"></script>
  <script src="dashboard.js?v=afterglow9"></script>
  <script src="catalog.js?v=afterglow9"></script>
  <script src="library.js?v=afterglow9"></script>
  <script src="media.js?v=afterglow9"></script>
  <script src="play.js?v=afterglow9"></script>
  <script src="app.js?v=afterglow9"></script>
</body>
</html>
